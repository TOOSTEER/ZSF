<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Квест — Главная</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <div class="stage-wrapper">
        <div class="stage main-page">

            <div class="abs main-header">
                <div id="team-name" class="main-team-name">Команда</div>
                <div class="main-team-color-row">
                    <span id="team-color-dot" class="main-team-color-dot"></span>
                </div>
            </div>

            <div class="abs progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div id="progress-percent" class="abs progress-percent">0%</div>

            <button id="btn-rk3" class="abs btn task-button"></button>
            <button id="btn-rk4" class="abs btn task-button"></button>
            <button id="btn-rk5" class="abs btn task-button"></button>
            <button id="btn-rk6" class="abs btn task-button"></button>
            <button id="btn-rk9" class="abs btn task-button"></button>
            <button id="btn-rk1rk2" class="abs btn task-button"></button>
            <button id="btn-ssfrk" class="abs btn task-button"></button>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
