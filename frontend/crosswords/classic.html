<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Квест — Кроссворд</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/crossword-classic.css" />
</head>
<body>
    <div class="stage-wrapper">
        <div class="stage classic-page">

            <!-- Экран 1: Вопросы -->
            <div id="screen-1" class="crossword-screen active">
                <h1 id="crossword-title" class="crossword-title">Кроссворд</h1>
                <div class="classic-grid-box">Сетка кроссворда появится здесь</div>
                <div id="clue-list" class="clue-list"></div>
            </div>

            <!-- Экран 2: Ввод ответов -->
            <div id="screen-2" class="crossword-screen">
                <h1 class="crossword-title">Ваши ответы</h1>
                <div id="answer-fields"></div>
                <button id="check-btn" class="check-btn">Проверить</button>
            </div>

            <!-- Нижняя навигация: стрелки + кнопка "Назад" -->
            <div class="crossword-nav">
                <button id="arrow-prev" class="nav-arrow prev">←</button>
                <button id="arrow-next" class="nav-arrow next">→</button>
                <button id="back-btn" class="nav-back-btn disabled" disabled>← На главную</button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal">
            <p id="result-text" style="font-size: 18px; font-weight: 600;"></p>
            <button id="result-close" class="btn-primary" style="width: 100%; height: 48px; border-radius: 24px; margin-top: 16px;">Ок</button>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/crossword-classic.js"></script>
</body>
</html>
