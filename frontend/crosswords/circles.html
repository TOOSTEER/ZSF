<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Квест — Кроссворд (круги)</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/crossword-circles.css" />
</head>
<body>
    <div class="stage-wrapper">
        <div class="stage circles-page" data-screen="1">
            <div id="screen-1" class="crossword-screen active">
                <h1 id="crossword-title" class="crossword-title">Кроссворд</h1>
                <div id="circle-1-1" class="letter-circle"></div>
                <div id="circle-1-2" class="letter-circle"></div>
                <div id="circle-1-3" class="letter-circle"></div>
                <div id="circle-1-4" class="letter-circle"></div>
                <input id="input-1-1" class="circle-input" type="text" autocomplete="off" />
                <input id="input-1-2" class="circle-input" type="text" autocomplete="off" />
                <input id="input-1-3" class="circle-input" type="text" autocomplete="off" />
                <input id="input-1-4" class="circle-input" type="text" autocomplete="off" />
            </div>

            <div id="screen-2" class="crossword-screen">
                <h1 class="crossword-title">Продолжение</h1>
                <div id="circle-2-1" class="letter-circle"></div>
                <div id="circle-2-2" class="letter-circle"></div>
                <div id="circle-2-3" class="letter-circle"></div>
                <input id="input-2-1" class="circle-input" type="text" autocomplete="off" />
                <input id="input-2-2" class="circle-input" type="text" autocomplete="off" />
                <input id="input-2-3" class="circle-input" type="text" autocomplete="off" />
                <button id="check-btn" class="check-btn">Проверить</button>
            </div>

            <div class="crossword-nav">
                <button id="arrow-prev" class="nav-arrow prev" aria-label="Назад"></button>
                <button id="arrow-next" class="nav-arrow next" aria-label="Вперёд"></button>
                <button id="back-btn" class="nav-back-btn disabled" disabled>← На главную</button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal">
            <p id="result-text" style="font-size: 18px; font-weight: 600;"></p>
            <button id="result-close" class="btn-primary">Ок</button>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/crossword-circles.js"></script>
</body>
</html>
