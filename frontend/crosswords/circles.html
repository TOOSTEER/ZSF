<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Квест — Кроссворд (круги)</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/crossword-circles.css" />
</head>
<body>
    <div class="stage-wrapper">
        <div class="stage circles-page">

            <!-- Экран 1: круги с буквами -->
            <div id="screen-1" class="crossword-screen active">
                <h1 id="crossword-title" class="crossword-title">Кроссворд</h1>
                <div id="circle-1-1" class="letter-circle">№1</div>
                <div id="circle-1-2" class="letter-circle">№2</div>
                <div id="circle-1-3" class="letter-circle">№3</div>
                <div id="circle-1-4" class="letter-circle">№4</div>
                <input id="input-1-1" class="circle-input" type="text" placeholder="Ответ 1" autocomplete="off" />
                <input id="input-1-2" class="circle-input" type="text" placeholder="Ответ 2" autocomplete="off" />
                <input id="input-1-3" class="circle-input" type="text" placeholder="Ответ 3" autocomplete="off" />
                <input id="input-1-4" class="circle-input" type="text" placeholder="Ответ 4" autocomplete="off" />
            </div>

            <!-- Экран 2: продолжение -->
            <div id="screen-2" class="crossword-screen">
                <h1 class="crossword-title">Продолжение</h1>
                <div id="circle-2-1" class="letter-circle">№5</div>
                <div id="circle-2-2" class="letter-circle">№6</div>
                <div id="circle-2-3" class="letter-circle">№7</div>
                <input id="input-2-1" class="circle-input" type="text" placeholder="Ответ 5" autocomplete="off" />
                <input id="input-2-2" class="circle-input" type="text" placeholder="Ответ 6" autocomplete="off" />
                <input id="input-2-3" class="circle-input" type="text" placeholder="Ответ 7" autocomplete="off" />
                <button id="check-btn" class="check-btn">Проверить</button>
            </div>

            <div class="crossword-nav">
                <button id="arrow-prev" class="nav-arrow prev">←</button>
                <button id="arrow-next" class="nav-arrow next">→</button>
                <button id="back-btn" class="nav-back-btn disabled" disabled>← На главную</button>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal">
            <p id="result-text" style="font-size: 18px; font-weight: 600;"></p>
            <button id="result-close" class="btn-primary" style="width: 100%; height: 48px; border-radius: 24px; margin-top: 16px;">Ок</button>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/crossword-circles.js"></script>
</body>
</html>
